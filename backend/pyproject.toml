[project]
name = "ai-cowork-game-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk==0.2.125",
  "fastapi>=0.139",
  "uvicorn>=0.51",
  "SQLAlchemy>=2.0.48",
  "aiomysql",
  "aiosqlite",
  "python-dotenv",
  "httpx",
  "pillow",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
