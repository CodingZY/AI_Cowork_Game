[project]
name = "ai-cowork-game-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncmy>=0.2",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "arq>=0.26",
  "redis>=5.0,<6",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "langfuse>=4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
